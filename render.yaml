# Render Blueprint for the ScanVerse backend — FREE TIER ($0/mo).
# Images are stored in PostgreSQL (no persistent disk needed).

services:
  - type: web
    name: scanverse-api
    env: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scanverse-db
          property: connectionString
      # IMPORTANT: replace with the exact URL of your Vercel frontend.
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: EXPORT_DIR
        value: /data/exports
      - key: CORS_ORIGINS
        value: '["https://scanverse-wyfc.vercel.app"]'

databases:
  - name: scanverse-db
    plan: free
    databaseName: scanverse
    user: scanverse
