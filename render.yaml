# Render Blueprint for the ScanVerse backend.
# Deploy: render.com -> New -> Blueprint -> select aradhya705/Scanverse.
#
# IMPORTANT: The starter plan ($7/mo) is required for persistent disk.
# Without it, uploaded files are wiped when the service restarts.

services:
  - type: web
    name: scanverse-api
    env: docker
    plan: starter
    disk:
      name: scanverse-data
      mountPath: /data
      sizeGB: 1
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scanverse-db
          property: connectionString
      # IMPORTANT: replace with the exact URL of your Vercel frontend.
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: EXPORT_DIR
        value: /data/exports
      - key: CORS_ORIGINS
        value: '["https://scanverse-wyfc.vercel.app"]'

databases:
  - name: scanverse-db
    plan: free
    databaseName: scanverse
    user: scanverse
