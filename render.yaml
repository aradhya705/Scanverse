# Render Blueprint for the ScanVerse backend.
# Deploy: render.com -> New -> Blueprint -> select aradhya705/Scanverse.
# The web service + Postgres + disk are created automatically from this file.
#
# Costs (approximate, 2026): web service Starter $7/mo, Postgres Starter $7/mo.
# Free tier options: set plan: free on both AND remove the "disk" block plus the
# UPLOAD_DIR / EXPORT_DIR env vars (free plan has no persistent disks, and free
# services sleep after 15 min of inactivity). Free Postgres expires after 90 days.

services:
  - type: web
    name: scanverse-api
    env: docker
    plan: starter
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scanverse-db
          property: connectionString
      # IMPORTANT: replace with the exact URL of your Vercel frontend.
      - key: CORS_ORIGINS
        value: '["https://scanverse-wyfc.vercel.app"]'
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: EXPORT_DIR
        value: /app/data/exports
    disk:
      name: scanverse-data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: scanverse-db
    plan: starter
    databaseName: scanverse
    user: scanverse
