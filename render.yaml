# Render Blueprint for the ScanVerse backend — FREE TIER ($0/mo).
# Deploy: render.com -> New -> Blueprint -> select aradhya705/Scanverse.
#
# Free-tier caveats (honest list):
#  - No persistent disk: uploaded/exported files are wiped on every redeploy.
#  - The web service sleeps after 15 min of inactivity; cold start ~1 min.
#  - 512 MB RAM: fine for scanning/PDF tools; heavy OCR may be tight.
#  - The free Postgres expires after 90 days (then swap to Neon/Supabase free).
# If you later want storage + more RAM, change plan to starter/standard and
# add the disk block again (that is what triggers the "pay" screen).

services:
  - type: web
    name: scanverse-api
    env: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scanverse-db
          property: connectionString
      # IMPORTANT: replace with the exact URL of your Vercel frontend.
      - key: CORS_ORIGINS
        value: '["https://scanverse-wyfc.vercel.app"]'

databases:
  - name: scanverse-db
    plan: free
    databaseName: scanverse
    user: scanverse
